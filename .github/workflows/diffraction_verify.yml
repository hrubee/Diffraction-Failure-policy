name: Diffraction Physical AI Simulation CI

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main ]

jobs:
  physical-ai-regression:
    name: Headless Isaac Sim & Cosmos Regression Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Robotics Navigation Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10+
        uses: setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Diffraction Verification CLI
        run: |
          python -m pip install --upgrade pip
          pip install requests pydantic pyyaml mcap

      - name: Run Diffraction Adversarial Stress Audit
        env:
          DIFFRACTION_API_KEY: ${{ secrets.DIFFRACTION_API_KEY }}
          DIFFRACTION_GATEWAY_URL: "https://api.diffraction.ai"
        run: |
          echo "Running automated regression against latest incident twins..."
          # Calls the cloud gateway to run 150 Cosmos adversarial rollouts on the new firmware policy
          python cli.py audit --scenarios 150

      - name: Verify Safety Compliance Threshold
        run: |
          echo "Verifying minimum safety compliance score (Target >= 95.0%)..."
          # Fails the pull request if the policy causes collisions in simulated edge cases
